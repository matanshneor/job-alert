http:
  user_agent: "personal-job-alert/1.0 (hourly check, low volume)"
  min_delay_seconds: 1.5      # wait at least this long between requests to the same host
  timeout_seconds: 30
  retries: 3                  # retried only on network errors, 429 and 5xx (never on 403)

location:
  # A job passes if any of its locations is in one of these countries...
  countries: [IL]
  # ...or any of its location texts mentions one of these words.
  israel_keywords:
    - israel
    - tel aviv
    - tel-aviv
    - jerusalem
    - haifa
    - herzliya
    - herzelia
    - ramat gan
    - ramat-gan
    - petah tikva
    - petah-tikva
    - petach tikva
    - raanana
    - ra'anana
    - yokneam
    - beer sheva
    - be'er sheva
    - netanya
    - rehovot
    - hod hasharon
    - kfar saba
    - rosh haayin
    - rosh ha'ayin
    - caesarea
    - airport city
    - modiin
    - kiryat gat
    - kiryat-gat
    - tel hai
    - or yehuda
    - bnei brak
    - givatayim
    - holon
    - rishon lezion
    - lod
    - matam
  # Remote jobs pass only if their location text is open to Israel.
  # A remote job with no region at all (just "Remote") also passes.
  remote_ok_keywords: [israel, emea, worldwide, anywhere, global]

alerts:
  max_per_run: 25             # extra pending alerts wait for the next run (nothing is lost)
  telegram_delay_seconds: 1.1 # Telegram allows about 1 message per second per chat

closing:
  missed_runs_to_close: 2     # a job must be missing in 2 successful runs in a row
  min_previous_count: 5       # if a source suddenly returns 0 jobs but had more than this, don't close anything
  warn_after_failures: 3      # Telegram warning when a source fails this many runs in a row

ai:
  enabled: true
  filter_model: claude-haiku-5-5     # extracts requirements and maps them to the profile
  score_model: claude-sonnet-5-5     # scores 0-100 with the fixed rubric, writes the Hebrew reason
  filter_effort: medium
  score_effort: medium
  max_evaluations_per_run: 40        # the rest wait for the next run
  max_description_chars: 60000       # safety cap; real postings are far shorter
  min_score_to_alert: 40             # jobs that pass the gap rules but score below this are not sent (0 = send all)

email:
  # Job-alert emails read from Gmail over IMAP (read-only). Needs GMAIL_ADDRESS + GMAIL_APP_PASSWORD.
  # These jobs have no description, so they skip the AI and the location filter, and are sent as-is
  # (still never twice, and never if the same job was already sent from a company board).
  enabled: true
  lookback_days: 3                   # each run looks at emails from the last N days it hasn't read yet
  sources:
    - key: gmail_linkedin            # stored as jobs.source; never change after the first run
      name: LinkedIn
      query: "from:jobalerts-noreply@linkedin.com"
      parser: linkedin
    - key: gmail_jobify
      name: Jobify
      query: "from:info@jobify360.co.il"
      parser: jobify
