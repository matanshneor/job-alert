# Companies to watch.
#
# To add a company: add an entry with its ATS ("applicant tracking system") and params.
# Supported ATS types so far: ashby, comeet, lever, greenhouse, eightfold, workday, oracle_hcm,
# and mizrahi (a parser for that one bank's careers page).
# Coming in phase 4: smartrecruiters.
#
# Fields:
#   slug     - short stable id, used in job keys. Never change it after the first run.
#   name     - display name in alerts.
#   aliases  - other spellings of the company name (used to match the same job from emails).
#   ats      - which collector to use.
#   params   - collector-specific settings (see each collector file in src/jobalert/collectors/).
#   enabled  - set to false to pause a company without deleting it.

companies:
  - slug: monday
    name: monday.com
    aliases: [monday, monday.com, mondaycom, monday com]
    ats: ashby
    params:
      board: monday.com          # https://jobs.ashbyhq.com/monday.com

  - slug: upwind
    name: Upwind
    aliases: [upwind, upwind security]
    ats: comeet
    params:
      comeet_slug: upwind        # https://www.comeet.com/jobs/upwind/49.004
      company_uid: "49.004"

  - slug: mobileye
    name: Mobileye
    aliases: [mobileye]
    ats: lever
    params:
      site: mobileye             # https://jobs.eu.lever.co/mobileye
      region: eu

  - slug: zim
    name: ZIM
    aliases: [zim, zim integrated shipping services, zim integrated shipping]
    ats: comeet
    params:
      comeet_slug: zim           # https://www.comeet.com/jobs/zim/72.008
      company_uid: "72.008"

  - slug: moonactive
    name: Moon Active
    aliases: [moon active, moonactive]
    ats: ashby
    params:
      board: moonactive          # https://jobs.ashbyhq.com/moonactive

  - slug: fiverr
    name: Fiverr
    aliases: [fiverr, fiverr international]
    ats: comeet
    params:
      comeet_slug: fiverr        # https://www.comeet.com/jobs/fiverr/60.002
      company_uid: "60.002"

  - slug: appsflyer
    name: AppsFlyer
    aliases: [appsflyer, apps flyer]
    ats: greenhouse
    params:
      board: appsflyer           # https://boards-api.greenhouse.io/v1/boards/appsflyer/jobs

  - slug: taboola
    name: Taboola
    aliases: [taboola]
    ats: greenhouse
    params:
      board: taboola             # https://boards-api.greenhouse.io/v1/boards/taboola/jobs

  - slug: payoneer
    name: Payoneer
    aliases: [payoneer]
    ats: greenhouse
    params:
      board: payoneer            # https://boards-api.greenhouse.io/v1/boards/payoneer/jobs

  - slug: nice
    name: NICE
    aliases: [nice, nice ltd, nice systems, nice ltd.]
    ats: greenhouse
    params:
      board: nice                # https://boards-api.greenhouse.io/v1/boards/nice/jobs

  - slug: amdocs
    name: Amdocs
    aliases: [amdocs]
    ats: eightfold
    params:
      host: jobs.amdocs.com      # https://jobs.amdocs.com/careers
      domain: amdocs.com
      location: Israel

  - slug: playtika
    name: Playtika
    aliases: [playtika]
    ats: greenhouse
    params:
      board: playtikaltd         # https://boards-api.greenhouse.io/v1/boards/playtikaltd/jobs

  - slug: paloalto
    name: Palo Alto Networks
    aliases: [palo alto networks, palo alto, paloaltonetworks, panw, cyberark, idira]   # CyberArk is now part of PANW
    ats: workday
    params:
      host: paloaltonetworks.wd5.myworkdayjobs.com   # https://jobs.paloaltonetworks.com
      tenant: paloaltonetworks
      site: panwexternalcareers
      country: IL
      facets:
        locations:   # Israel: Be'er Sheva, Petach Tikva, Tel Aviv (office), Tel Aviv-Yafo
          - 45eb6188f3f71001f08639efd22e0000
          - 45eb6188f3f71001f086499c91d00000
          - 462d9b819ff31060221ce2cad22df7c3
          - e62cc4173be310016a98d270a39f0000

  - slug: discount
    name: Bank Discount
    aliases: [discount, bank discount, israel discount bank, דיסקונט, בנק דיסקונט]
    ats: oracle_hcm
    params:
      host: ehsb.fa.em2.oraclecloud.com   # https://www.discountbank.co.il/jobs/
      site_number: CX_3001

  - slug: mizrahi
    name: Mizrahi-Tefahot
    aliases: [mizrahi, mizrahi tefahot, mizrahi-tefahot, מזרחי, מזרחי טפחות, מזרחי-טפחות]
    ats: mizrahi
    params:
      url: https://www.mizrahi-tefahot.co.il/about-mizrahi-tefahot-he/career/open-jobs/

  # ---- Phase 4 ----
  # NVIDIA and Intel: the workday collector exists now, but these two were not re-checked yet.
  - slug: nvidia
    name: NVIDIA
    aliases: [nvidia]
    ats: workday
    enabled: false
    params:
      host: nvidia.wd5.myworkdayjobs.com
      tenant: nvidia
      site: NVIDIAExternalCareerSite
      facets: {locationHierarchy1: ["2fcb99c455831013ea52bbe14cf9326c"]}   # Israel

  - slug: intel
    name: Intel
    aliases: [intel, intel corporation]
    ats: workday
    enabled: false
    params:
      host: intel.wd1.myworkdayjobs.com
      tenant: intel
      site: External
      facets:
        locations:   # Israel sites: Haifa, Jerusalem, Kiryat-Gat, Petah-Tikva
          - 1e4a4eb3adf1013563ba9174bf817fcd
          - 1e4a4eb3adf101f41cd29774bf8184cd
          - 1e4a4eb3adf101cb242c9e74bf8189cd
          - 1e4a4eb3adf101aaeda8a474bf818ecd

  - slug: wix
    name: Wix
    aliases: [wix, wix.com, wixcom]
    ats: smartrecruiters
    enabled: false
    params:
      company_id: Wix2
      country: il

# Checked and NOT added (Nov 2026):
#   Check Point  - own site (careers.checkpoint.com), blocks automated requests (403).
#   Elbit        - own site, blocks automated requests (403).
#   Bank Hapoalim, Bank Leumi - own sites, block automated requests.
#   CyberArk     - acquired by Palo Alto Networks; its jobs come in through the 'paloalto' entry above.
# Google, Microsoft, Apple: covered by email alerts (phase 3), not scraped.
