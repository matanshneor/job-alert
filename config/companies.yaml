# Companies to watch.
#
# To add a company: add an entry with its ATS ("applicant tracking system") and params.
# Supported ATS types so far: ashby, comeet, lever, greenhouse, eightfold, workday, oracle_hcm,
# smartrecruiters, and mizrahi (a parser for that one bank's careers page).
#
# Fields:
#   slug     - short stable id, used in job keys. Never change it after the first run.
#   name     - display name in alerts.
#   aliases  - other spellings of the company name (used to match the same job from emails).
#   ats      - which collector to use.
#   params   - collector-specific settings (see each collector file in src/jobalert/collectors/).
#   enabled  - set to false to pause a company without deleting it.

companies:
  - slug: monday
    name: monday.com
    aliases: [monday, monday.com, mondaycom, monday com]
    ats: ashby
    params:
      board: monday.com          # https://jobs.ashbyhq.com/monday.com

  - slug: upwind
    name: Upwind
    aliases: [upwind, upwind security]
    ats: comeet
    params:
      comeet_slug: upwind        # https://www.comeet.com/jobs/upwind/49.004
      company_uid: "49.004"

  - slug: mobileye
    name: Mobileye
    aliases: [mobileye]
    ats: lever
    params:
      site: mobileye             # https://jobs.eu.lever.co/mobileye
      region: eu

  - slug: zim
    name: ZIM
    aliases: [zim, zim integrated shipping services, zim integrated shipping]
    ats: comeet
    enabled: false               # all its jobs are in Haifa, outside location.exclude_keywords
    params:
      comeet_slug: zim           # https://www.comeet.com/jobs/zim/72.008
      company_uid: "72.008"

  - slug: moonactive
    name: Moon Active
    aliases: [moon active, moonactive]
